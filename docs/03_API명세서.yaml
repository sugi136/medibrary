openapi: 3.0.3
info:
  title: 메디브러리(Medibrary) API
  description: Vue 프론트엔드 - Spring Boot 백엔드로 구성된 의약품 검색/부작용 조회/즐겨찾기/병용금기 서비스 API
  version: 1.2.0
servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: auth
  - name: drugs
  - name: favorites
  - name: dashboard

paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입 (REQ-F-001)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 4 }
                name: { type: string }
      responses:
        '201': { description: 가입 성공 }
        '409': { description: 이메일 중복 }

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인 (REQ-F-002)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 로그인 성공, JWT 반환
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
        '401': { description: 인증 실패 }

  /drugs/search:
    get:
      tags: [drugs]
      summary: 약 이름/모양/색깔 검색 (REQ-F-003, REQ-F-004, REQ-F-005)
      parameters:
        - name: name
          in: query
          schema: { type: string }
          description: 약 이름 키워드
        - name: shape
          in: query
          schema: { type: string }
        - name: color
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 검색 결과 리스트 (이미지 URL 포함)
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DrugSummary' }

  /drugs/{drugId}:
    get:
      tags: [drugs]
      summary: 약 상세 조회 (REQ-F-006)
      parameters:
        - name: drugId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 상세 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugDetail' }
        '404': { description: 존재하지 않는 약 }

  /drugs/{drugId}/side-effects:
    get:
      tags: [drugs]
      summary: 국내 허가사항·해외 FAERS 부작용 비교 조회 (REQ-F-007, REQ-F-008, REQ-F-013, REQ-N-001, REQ-N-004, REQ-N-008)
      parameters:
        - name: drugId
          in: path
          required: true
          schema: { type: string }
        - name: source
          in: query
          description: domestic(국내) / overseas(해외, openFDA) / all(기본값)
          schema: { type: string, enum: [domestic, overseas, all], default: all }
      responses:
        '200':
          description: 부작용 사례 목록. 매핑 실패/외부 API 장애 시 해당 source는 available=false 로 반환
          content:
            application/json:
              schema:
                type: object
                properties:
                  domestic: { $ref: '#/components/schemas/SideEffectResult' }
                  overseas: { $ref: '#/components/schemas/SideEffectResult' }
                  disclaimer:
                    type: string
                    description: FAERS 자발보고 데이터의 비인과성·비발생빈도 한계 안내

  /drugs/{drugId}/duplicates:
    get:
      tags: [drugs]
      summary: 동일 성분·효능군 중복 경고 조회 (REQ-F-014)
      parameters:
        - name: drugId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 즐겨찾기 기반 동일 성분 중복과 DUR 효능군 중복 후보. 로그인하지 않은 경우 동일 성분 결과는 빈 목록으로 반환.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateWarningResponse' }

  /drugs/{drugId}/contraindications:
    get:
      tags: [drugs]
      summary: 현재 약과 병용금기/주의 의약품 조회 (REQ-F-009 확장 - 상세화면 "함께 먹으면 안 되는 약" 탭)
      parameters:
        - name: drugId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >
            병용금기/주의 의약품 목록. 결과 없음, 외부 DUR API 장애/타임아웃 모두
            HTTP 200으로 반환하여 상세 페이지의 다른 탭이 정상 동작하도록 함(available 플래그로 구분).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContraindicationResult' }

  /favorites:
    get:
      tags: [favorites]
      summary: 즐겨찾기 목록 조회 (REQ-F-011, DUR 체크 포함)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 즐겨찾기 목록 + 병용금기 경고
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items: { $ref: '#/components/schemas/FavoriteDrugSummary' }
                  durWarnings:
                    type: array
                    items: { $ref: '#/components/schemas/DurWarning' }
        '401': { description: 인증 필요 }
    post:
      tags: [favorites]
      summary: 즐겨찾기 등록 (REQ-F-010)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drugId]
              properties:
                drugId: { type: string }
      responses:
        '201': { description: 등록 성공 }
        '409': { description: 이미 등록됨 }

  /favorites/{favoriteId}:
    delete:
      tags: [favorites]
      summary: 즐겨찾기 목록의 식별자로 즐겨찾기 해제 (REQ-F-010)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: favoriteId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: 해제 성공 }
        '404': { description: 존재하지 않음 }

  /favorites/drug/{drugId}:
    delete:
      tags: [favorites]
      summary: 약 식별자로 즐겨찾기 해제 (상세 화면용, REQ-F-010)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: drugId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 해제 성공 }
        '404': { description: 해당 약의 즐겨찾기 정보 없음 }

  /dashboard/summary:
    get:
      tags: [dashboard]
      summary: 대시보드 요약 (REQ-F-012)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 최근 검색어, 즐겨찾기 수, 병용금기 여부 요약
          content:
            application/json:
              schema:
                type: object
                properties:
                  recentSearches:
                    type: array
                    maxItems: 5
                    description: 로그인 사용자의 최신 검색 조건(이름·모양·색상) 역순 목록
                    items: { type: string }
                  favoriteCount: { type: integer }
                  hasDurWarning: { type: boolean }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DrugSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        manufacturer: { type: string }
        shape: { type: string }
        color: { type: string }
        imageUrl: { type: string }

    FavoriteDrugSummary:
      allOf:
        - $ref: '#/components/schemas/DrugSummary'
        - type: object
          properties:
            favoriteId: { type: integer }

    DrugDetail:
      allOf:
        - $ref: '#/components/schemas/DrugSummary'
        - type: object
          properties:
            markFront: { type: string }
            markBack: { type: string }
            ingredientKr:
              type: string
              nullable: true
              description: 한글 주성분명. 데이터가 없으면 ingredientEn을 보조 표기로 사용한다.
            ingredientEn:
              type: string
              nullable: true
              description: openFDA 조회용 영문 주성분명
            efficacy: { type: string }
            usageInfo: { type: string }
            caution: { type: string }
            isFavorite: { type: boolean }

    SideEffectResult:
      type: object
      properties:
        available: { type: boolean }
        cases:
          type: array
          items: { $ref: '#/components/schemas/SideEffectCase' }
        message:
          type: string
          description: available=false 일 때 사용자에게 보여줄 안내 문구

    SideEffectCase:
      type: object
      properties:
        term: { type: string, description: 국내 이상반응 원문 또는 해외 MedDRA 반응 용어 }
        count:
          type: integer
          nullable: true
          description: 해외 FAERS 보고 건수. 국내 허가사항 원문은 null.
        domesticMentioned:
          type: boolean
          description: 해외 반응 용어가 제한된 국문 동의어 사전 기준 국내 문서에 언급됐는지 여부

    DuplicateWarningItem:
      type: object
      properties:
        drugId: { type: string }
        name: { type: string }
        category: { type: string, enum: [SAME_INGREDIENT, SAME_EFFICACY_GROUP] }
        reason: { type: string }

    DuplicateWarningResponse:
      type: object
      properties:
        drugId: { type: string }
        available: { type: boolean }
        sameIngredientItems:
          type: array
          items: { $ref: '#/components/schemas/DuplicateWarningItem' }
        efficacyGroupItems:
          type: array
          items: { $ref: '#/components/schemas/DuplicateWarningItem' }
        message: { type: string, nullable: true }

    DurWarning:
      type: object
      properties:
        drugIdA: { type: string }
        drugIdB: { type: string }
        reason: { type: string }
        severity: { type: string }

    ContraindicationItem:
      type: object
      properties:
        drugId: { type: string }
        name: { type: string }
        manufacturer:
          type: string
          nullable: true
          description: DUR 응답에 제조사 정보가 없으면 null 허용
        type:
          type: string
          enum: [CONTRAINDICATED, CAUTION]
        reason: { type: string }

    ContraindicationResult:
      type: object
      properties:
        drugId: { type: string }
        available: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/ContraindicationItem' }
        message:
          type: string
          nullable: true
          description: '결과 없음: "확인된 병용금기 정보가 없습니다" / 장애: "현재 병용금기 정보를 불러올 수 없습니다"'
