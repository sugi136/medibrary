spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:medibrary;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  external:
    data-go-kr-service-key: ${DATA_GO_KR_SERVICE_KEY:}
