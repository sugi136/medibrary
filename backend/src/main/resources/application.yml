server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

spring:
  application:
    name: medibrary-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medibrary}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173},https://medibrary-penguin16.vercel.app
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-development-secret-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  external:
    data-go-kr-service-key: ${DATA_GO_KR_SERVICE_KEY:}
    openfda-base-url: ${OPENFDA_BASE_URL:https://api.fda.gov}
    timeout-millis: ${EXTERNAL_API_TIMEOUT_MILLIS:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
