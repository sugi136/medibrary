services:
  postgres:
    image: postgres:16-alpine
    container_name: medibrary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medibrary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
