services:
  - type: web
    name: medibrary-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: OPENFDA_BASE_URL
        value: https://api.fda.gov
      - key: EXTERNAL_API_TIMEOUT_MILLIS
        value: "5000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
